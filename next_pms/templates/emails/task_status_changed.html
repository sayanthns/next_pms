<h3>Task Status Changed: {{ task_title }}</h3>
<p>The status of a task in project <b>{{ project_name }}</b> has been updated:</p>
<table style="border-collapse:collapse; width:100%; max-width:600px;">
  <tr><td style="padding:8px; border:1px solid #e5e7eb; font-weight:600;">Task</td><td style="padding:8px; border:1px solid #e5e7eb;">{{ task_title }}</td></tr>
  <tr><td style="padding:8px; border:1px solid #e5e7eb; font-weight:600;">Project</td><td style="padding:8px; border:1px solid #e5e7eb;">{{ project_name }}</td></tr>
  <tr><td style="padding:8px; border:1px solid #e5e7eb; font-weight:600;">Status</td><td style="padding:8px; border:1px solid #e5e7eb;"><span style="color:#9ca3af;">{{ old_status }}</span> &rarr; <b style="color:#6366f1;">{{ new_status }}</b></td></tr>
  <tr><td style="padding:8px; border:1px solid #e5e7eb; font-weight:600;">Changed By</td><td style="padding:8px; border:1px solid #e5e7eb;">{{ changed_by }}</td></tr>
</table>
<p style="margin-top:16px;"><a href="{{ task_url }}" style="background:#2563EB; color:white; padding:10px 20px; text-decoration:none; border-radius:6px;">View Task</a></p>
